          # unmutated source first (worker 0) and fails the shard if any test fails or hits OutOfMemoryException under the heap cap
          # a mutant that allocates without bound must die alone (a RunError, never a kill: see PCA_RUNERR_LOG), not exhaust
          # the runner: 3 GiB GC heap per test host, set in the test project's runtimeconfig (CI copy only). Not as a DOTNET_GCHeapHardLimit environment
          # variable: that also caps Stryker's in-process compilation, and every Pca.cs mutant then "caused compile errors".
