          fi
          # shards 1 and 20 (and the Pca.cs spans 70, 71) lost their runner (memory) at 4 workers x 3 GiB: 2 workers there
          # the Stryker pass runs only the test classes that ran this shard's mutants last time (a stale list costs time, never a
          # verdict: every mutant it does not kill is re-run against the full oracle by stryker-isolate.py)
          [ -z "${STRYKER_COVER:-}" ] || python3 "$GITHUB_WORKSPACE/.github/scripts/stryker-filter.py" stryker-config.json "$STRYKER_COVER"
          CONC=4; case "${{ matrix.shard }}" in 1|20|70|71|304|305|306|307|308|399|400|401|402|403|404|405|406|407|408|409|726|727|728) CONC=2;; 47|49|50|80|81|82|384|385|386|387|415|416|417|418|419) CONC=1;; esac
          touch "$RUNNER_TEMP/stryker-ran"
          # watchdog: logs memory / load / threads every 20 s and SIGKILLs a dotnet process over 9 GB RSS (a mutant's test host, not the runner);
          # its kill log is read by the isolate step. Plain background loop: no trap, no wait.
          bash "$GITHUB_WORKSPACE/.github/scripts/watchdog.sh" "$RUNNER_TEMP/watchdog.log" &
          WD=$!
          rc=0
          dotnet stryker --config-file stryker-config.json --log-to-file --concurrency "$CONC" "${M[@]}" 2>&1 | grep -vE '^\s*$' | tee "$RUNNER_TEMP/stryker.out" | tail -30 || rc=$?
          kill "$WD" 2>/dev/null || true
          [ "$rc" = 0 ] || grep -aE "error CS|CS[0-9]{4}|compil|rollback|Rollback" "$RUNNER_TEMP/stryker.out" | cut -c1-400 | head -80 || true
          [ "$rc" = 0 ] || { echo "compile diagnostics from the trace log:"; echo "compile attempts: $(find . -path "*StrykerOutput*" -name "*.txt" -exec grep -ahc "Trying compilation" {} + 2>/dev/null | awk '{ s += $1 } END { print s + 0 }')"; find . -path "*StrykerOutput*" -name "*.txt" -exec grep -ahE "error CS[0-9]{4}|CS[0-9]{4}[:,]|SourceFile\(|RollBacking|General compilation error|unidentified mutation|Safe Mode|Unable to extract|Found mutant" {} + 2>/dev/null | sed -E "s/^[^[]*\[[A-Z]{3}\] //" | sort | uniq -c | sort -rn | cut -c1-400 | head -80 || true; }
          exit "$rc"
      - name: Report (+ every in-scope CompileError and every carried survivor tested alone)
        run: |
          S="$GITHUB_WORKSPACE/.github/scripts"; D="$MONO/sdks/dotnet-pca"
          REP="$(ls -d "$D"/AtlasPca.Corpus.Tests/StrykerOutput/*/reports/mutation-report.json "$D"/AtlasPca.AspNetCore.Tests/StrykerOutput/*/reports/mutation-report.json 2>/dev/null | tail -1 || true)"
          [ -n "$REP" ] || [ -n "${STRYKER_BASELINE:-}" ] || { echo "::error::no Stryker report"; exit 1; }
