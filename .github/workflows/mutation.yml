          # the oracle's RunErrorProbe logs every OutOfMemoryException (with its test) here: a mutant whose killing test only
          # hit the heap cap is re-tested alone and reported as a RunError, never as a kill
          PCA_RUNERR_LOG: ${{ runner.temp }}/runerr-stryker.log
        run: |
          set -o pipefail   # a failed Stryker run must fail the step (the grep|tail pipe below masked its exit status)
