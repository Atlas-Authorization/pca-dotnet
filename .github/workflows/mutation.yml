               && python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("classes") else 1)' "$RUNNER_TEMP/cover-in/stryker-baseline.json"; then
              echo "STRYKER_COVER=$RUNNER_TEMP/cover-in/stryker-baseline.json" >> "$GITHUB_ENV"; echo "covering classes from run $id"; exit 0
            fi
