          # pins the .NET 8 SDK (global.json, CI copy only).
          # Stryker before 4.15 compiles with its own compiler's latest C# (14), not the project's (12 on net8.0): under C# 14 an array's
          # .Reverse() binds to the void Span overload and the unmutated source fails to compile, so stryker-config.json pins language-version CSharp12.
