          [ -n "${STRYKER_BASELINE:-}" ] && T=(--baseline "$STRYKER_BASELINE" --carry "$RUNNER_TEMP/carried.json")
          python3 "$GITHUB_WORKSPACE/.github/scripts/stryker-spans.py" ${{ matrix.shard }} "$SHARDS" ../AtlasPca \
            --scope "$RUNNER_TEMP/scope.json" "${T[@]}" > "$RUNNER_TEMP/globs.txt"
