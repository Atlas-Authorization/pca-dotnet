          # the isolated builds need the unfenced sources (the fenced copy has the shard's directive lines)
          cp -R "$GITHUB_WORKSPACE"/AtlasPca/. "$D/AtlasPca/"
          cp -R "$GITHUB_WORKSPACE"/AtlasPca.AspNetCore/. "$D/AtlasPca.AspNetCore/"
          # run even with nothing to retest: its unmutated full run (worker 0) is the shard's only check that the oracle passes unmutated
          if [ -s "$RUNNER_TEMP/retest.json" ]; then
            bash "$S/watchdog.sh" "$RUNNER_TEMP/watchdog.log" &
            WD=$!
            python3 "$S/stryker-isolate.py" --src "$D" --mutants "$RUNNER_TEMP/retest.json" --out "$RUNNER_TEMP/isolated.json" --watchdog-log "$RUNNER_TEMP/watchdog.log" \
              --jobs 4 --stop-on-fail --deadline $((JOB_START + 305 * 60)) > "$RUNNER_TEMP/isolate.log" 2>&1 || { kill "$WD" 2>/dev/null || true; tail -80 "$RUNNER_TEMP/isolate.log"; echo "::error::stryker-isolate.py failed"; exit 1; }
            kill "$WD" 2>/dev/null || true
            tail -30 "$RUNNER_TEMP/isolate.log"
            grep -vE '^\[[0-9]+/[0-9]+\] (Killed|CompileError) ' "$RUNNER_TEMP/isolate.log" | tail -80
          fi
          python3 "$S/stryker-report.py" finish --all "$RUNNER_TEMP/all.json" --isolated "$RUNNER_TEMP/isolated.json" \
            --sources "$GITHUB_WORKSPACE" --scope "$RUNNER_TEMP/scope.json" --classes "$RUNNER_TEMP/classes.json" --counts counts.json \
            --survivors survivors.json --baseline stryker-baseline.json --runerrors run-errors-${{ matrix.shard }}.json \
            --ledger "$MONO/sdks/dotnet-pca/mutation-run-errors.json" --killed killed-${{ matrix.shard }}.json
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.shard }} --of="$SHARDS" --tool=stryker-net \
            --counts=counts.json --survivors=survivors.json $(grep -qx '{}' counts.json && echo --empty=no-mutant-in-scope) --out=shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            run-errors-${{ matrix.shard }}.json
            killed-${{ matrix.shard }}.json
            cost-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: stryker-baseline-${{ matrix.shard }}
          path: stryker-baseline.json
          retention-days: 30
      # mutants the time budget left untested are listed as UNTESTED survivors (no ledger entry can match one: the merge
      # fails) and the shard fails too; the next targeted run tests them from this shard's baseline
      - name: Every in-scope mutant tested
        run: |
          n="$(python3 -c 'import json; c = json.load(open("counts.json")); print(c.get("Untested", 0) + c.get("Ignored", 0))')"
          [ "$n" = 0 ] || { echo "::error::$n mutant(s) left untested by the time budget"; exit 1; }

  # the opt-in modules: same pipeline as `shard` (spans plan, targeted baseline, stryker-isolate.py, report), one Stryker project per
  # shard whose oracle is the module's test project; the native library each replay workflow builds is built here too
  module-shard:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    name: module shard ${{ matrix.shard }}/939 (${{ matrix.mod }})
    needs: [reuse, natives]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4 # fair share: about 24 runners per PCA repo (10 repos, about 180 shared runners); one repo must never starve the rest
      matrix:
        include:
          - { shard: 83, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 84, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 85, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 86, mod: fhe, proj: AtlasPca.Fhe, tests: AtlasPca.Fhe.Tests, dirs: 'AtlasPca,AtlasPca.Fhe', jobs: 4 }
          - { shard: 87, mod: lwe-ot, proj: AtlasPca.MpcLweOt, tests: AtlasPca.MpcLweOt.Tests, dirs: 'AtlasPca,AtlasPca.Mpc,AtlasPca.Corpus.Tests,AtlasPca.MpcLweOt', jobs: 2 }
          - { shard: 88, mod: fndsa, proj: AtlasPca.Fndsa, tests: AtlasPca.Fndsa.Tests, dirs: 'AtlasPca,AtlasPca.Fndsa', jobs: 4 }
          - { shard: 222, mod: zk, proj: AtlasPca.Zk, tests: AtlasPca.Zk.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Zk', jobs: 4 }
          - { shard: 420, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 421, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 422, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 423, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 424, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 425, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 426, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 427, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 428, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 429, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 430, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 431, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 432, mod: pairing, proj: AtlasPca.Pairing, tests: AtlasPca.Pairing.Tests, dirs: 'AtlasPca,AtlasPca.Corpus.Tests,AtlasPca.Pairing', jobs: 2 }
          - { shard: 433, mod: fhe, proj: AtlasPca.Fhe, tests: AtlasPca.Fhe.Tests, dirs: 'AtlasPca,AtlasPca.Fhe', jobs: 4 }
          - { shard: 434, mod: lwe-ot, proj: AtlasPca.MpcLweOt, tests: AtlasPca.MpcLweOt.Tests, dirs: 'AtlasPca,AtlasPca.Mpc,AtlasPca.Corpus.Tests,AtlasPca.MpcLweOt', jobs: 2 }
          - { shard: 435, mod: lwe-ot, proj: AtlasPca.MpcLweOt, tests: AtlasPca.MpcLweOt.Tests, dirs: 'AtlasPca,AtlasPca.Mpc,AtlasPca.Corpus.Tests,AtlasPca.MpcLweOt', jobs: 2 }
    env:
      PROJ: ${{ matrix.proj }}
      TESTS: ${{ matrix.tests }}
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh "$CRATE"
      # native libraries as in the module's replay workflow (pairing.yml, fhe.yml, lwe-ot.yml, fndsa.yml), built once by the natives job
      - uses: actions/download-artifact@v4
        with:
          name: natives
          path: ${{ runner.temp }}/natives
      - name: Native library paths
        run: |
          sed "s#@N@#$RUNNER_TEMP/natives#g" "$RUNNER_TEMP/natives/env.txt" >> "$GITHUB_ENV"
          mkdir -p "$MONO/sdks/dotnet-pca/AtlasPca.Pairing.Tests/native"
          cp -R "$RUNNER_TEMP/natives/pairing-native/." "$MONO/sdks/dotnet-pca/AtlasPca.Pairing.Tests/native/"
          mkdir -p "$MONO/sdks/dotnet-pca/AtlasPca.Pairing/Blst"
          cp "$RUNNER_TEMP/natives/pairing-blst/blst.cs" "$MONO/sdks/dotnet-pca/AtlasPca.Pairing/Blst/"
      - name: Secret-key oracle corpus (abe)
        if: ${{ matrix.mod == 'pairing' }}
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/dotnet-pca/AtlasPca.Pairing.Tests/test-data" abe:abe
      - name: Baseline (targeted mode)
        if: ${{ !(inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline_run }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-in"
          ids="$BASELINE"
          if [ -z "$ids" ]; then
            ids="$(gh run list -R "$GITHUB_REPOSITORY" --workflow mutation.yml --branch "$GITHUB_REF_NAME" --limit 20 \
                     --json databaseId -q '.[].databaseId' | grep -vx "$GITHUB_RUN_ID" || true)"
          fi
          for id in $ids; do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "stryker-baseline-$SHARD" -D "$RUNNER_TEMP/baseline-in" 2>/dev/null \
               && [ -s "$RUNNER_TEMP/baseline-in/stryker-baseline.json" ]; then
              echo "STRYKER_BASELINE=$RUNNER_TEMP/baseline-in/stryker-baseline.json" >> "$GITHUB_ENV"
              echo "targeted: shard $SHARD seeded from run $id"; exit 0
            fi
          done
          echo "::notice::shard $SHARD: no baseline found, full run (seeds the baseline for the next run)"
      - name: Isolate selftest (process-group kill, watchdog kill is a RunError)
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/stryker-isolate.selftest.py"
      - name: Mutate
        working-directory: ${{ env.MONO }}/sdks/dotnet-pca/${{ matrix.tests }}
        env:
          PCA_RUNERR_LOG: ${{ runner.temp }}/runerr-stryker.log
        run: |
          set -o pipefail
          dotnet tool install -g dotnet-stryker --version 4.8.1
          SDK8="$(dotnet --list-sdks | awk '/^8\./ { v = $1 } END { print v }')"
          [ -n "$SDK8" ] || { echo "::error::no .NET 8 SDK"; exit 1; }
          (cd .. && dotnet new globaljson --sdk-version "$SDK8" --roll-forward disable --force >/dev/null)
          dotnet test -c Release > "$RUNNER_TEMP/baseline.log" 2>&1 || { tail -40 "$RUNNER_TEMP/baseline.log"; echo "::error::the oracle fails on the unmutated source"; exit 1; }
          [ ! -s "$PCA_RUNERR_LOG" ] || { cat "$PCA_RUNERR_LOG"; echo "::error::the unmutated source hits OutOfMemoryException"; exit 1; }
          # the same 3 GiB GC heap cap per test host as the core shards (an unbounded allocation dies alone, as a RunError)
          python3 - <<'PY'
          import os
          f = os.environ["TESTS"] + ".csproj"
          s = open(f).read()
          cap = '<ItemGroup><RuntimeHostConfigurationOption Include="System.GC.HeapHardLimit" Value="3221225472" /></ItemGroup>'
          assert "</Project>" in s
          open(f, "w").write(s.replace("</Project>", cap + "\n</Project>"))
          PY
          # the module's own Stryker project: the core's settings, this project and this oracle
          python3 - <<'PY'
          import json, os
          c = json.load(open("../AtlasPca.Corpus.Tests/stryker-config.json"))
          c["stryker-config"].update({"project": os.environ["PROJ"] + ".csproj", "test-projects": [os.environ["TESTS"] + ".csproj"]})
          json.dump(c, open("stryker-config.json", "w"))
          PY
          T=()
          [ -n "${STRYKER_BASELINE:-}" ] && T=(--baseline "$STRYKER_BASELINE" --carry "$RUNNER_TEMP/carried.json")
          python3 "$GITHUB_WORKSPACE/.github/scripts/stryker-spans.py" ${{ matrix.shard }} "$SHARDS" ../AtlasPca \
            --scope "$RUNNER_TEMP/scope.json" "${T[@]}" > "$RUNNER_TEMP/globs.txt"
          M=()
          while read -r g; do M+=(--mutate "$g"); done < "$RUNNER_TEMP/globs.txt"
          if [ "${#M[@]}" -eq 0 ]; then
            [ -n "${STRYKER_BASELINE:-}" ] || { echo "::error::no --mutate glob for this shard"; exit 1; }
            echo "targeted: no source line of this shard changed since the baseline, Stryker skipped"
            exit 0
          fi
          echo "mutate: ${M[*]}"
          touch "$RUNNER_TEMP/stryker-ran"
          bash "$GITHUB_WORKSPACE/.github/scripts/watchdog.sh" "$RUNNER_TEMP/watchdog.log" &
          WD=$!
          rc=0
          dotnet stryker --config-file stryker-config.json --log-to-file --concurrency 4 "${M[@]}" 2>&1 | grep -vE '^\s*$' | tee "$RUNNER_TEMP/stryker.out" | tail -30 || rc=$?
          kill "$WD" 2>/dev/null || true
          [ "$rc" = 0 ] || grep -aE "error CS|CS[0-9]{4}|compil|rollback|Rollback" "$RUNNER_TEMP/stryker.out" | cut -c1-400 | head -80 || true
          [ "$rc" = 0 ] || { echo "compile diagnostics from the trace log:"; echo "compile attempts: $(find . -path "*StrykerOutput*" -name "*.txt" -exec grep -ahc "Trying compilation" {} + 2>/dev/null | awk '{ s += $1 } END { print s + 0 }')"; find . -path "*StrykerOutput*" -name "*.txt" -exec grep -ahE "error CS[0-9]{4}|CS[0-9]{4}[:,]|SourceFile\(|RollBacking|General compilation error|unidentified mutation|Safe Mode|Unable to extract|Found mutant" {} + 2>/dev/null | sed -E "s/^[^[]*\[[A-Z]{3}\] //" | sort | uniq -c | sort -rn | cut -c1-400 | head -80 || true; }
          exit "$rc"
      - name: Report (+ every in-scope CompileError and every carried survivor tested alone)
        run: |
          S="$GITHUB_WORKSPACE/.github/scripts"; D="$MONO/sdks/dotnet-pca"
          REP="$(ls -d "$D/$TESTS"/StrykerOutput/*/reports/mutation-report.json 2>/dev/null | tail -1 || true)"
          [ -n "$REP" ] || [ -n "${STRYKER_BASELINE:-}" ] || { echo "::error::no Stryker report"; exit 1; }
          [ ! -f "$RUNNER_TEMP/stryker-ran" ] || [ -n "$REP" ] || { echo "::error::Stryker ran but wrote no report"; exit 1; }
          A=(--scope "$RUNNER_TEMP/scope.json" --all "$RUNNER_TEMP/all.json" --retest "$RUNNER_TEMP/retest.json" --runerr-log "$RUNNER_TEMP/runerr-stryker.log" --cost cost-${{ matrix.shard }}.json)
          [ -n "$REP" ] && A+=(--report "$REP")
          [ -f "$RUNNER_TEMP/carried.json" ] && A+=(--carried "$RUNNER_TEMP/carried.json")
          python3 "$S/stryker-report.py" collect "${A[@]}"
          # the isolated builds need the unfenced sources (the fenced copy has the shard's directive lines)
          cp -R "$GITHUB_WORKSPACE/$PROJ/." "$D/$PROJ/"
          if [ "$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/retest.json")" -gt 0 ]; then
            bash "$S/watchdog.sh" "$RUNNER_TEMP/watchdog.log" &
            WD=$!
            python3 "$S/stryker-isolate.py" --src "$D" --mutants "$RUNNER_TEMP/retest.json" --out "$RUNNER_TEMP/isolated.json" --watchdog-log "$RUNNER_TEMP/watchdog.log" \
              --tests "$TESTS" --dirs "${{ matrix.dirs }}" \
              --jobs ${{ matrix.jobs }} --stop-on-fail --deadline $((JOB_START + 305 * 60)) > "$RUNNER_TEMP/isolate.log" 2>&1 || { kill "$WD" 2>/dev/null || true; tail -80 "$RUNNER_TEMP/isolate.log"; echo "::error::stryker-isolate.py failed"; exit 1; }
            kill "$WD" 2>/dev/null || true
            tail -30 "$RUNNER_TEMP/isolate.log"
            grep -vE '^\[[0-9]+/[0-9]+\] (Killed|CompileError) ' "$RUNNER_TEMP/isolate.log" | tail -80
          fi
          python3 "$S/stryker-report.py" finish --all "$RUNNER_TEMP/all.json" --isolated "$RUNNER_TEMP/isolated.json" \
            --sources "$GITHUB_WORKSPACE" --scope "$RUNNER_TEMP/scope.json" --counts counts.json \
            --survivors survivors.json --baseline stryker-baseline.json --runerrors run-errors-${{ matrix.shard }}.json \
            --ledger "$MONO/sdks/dotnet-pca/mutation-run-errors.json" --killed killed-${{ matrix.shard }}.json
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.shard }} --of="$SHARDS" --tool=stryker-net \
            --counts=counts.json --survivors=survivors.json $(grep -qx '{}' counts.json && echo --empty=no-mutant-in-scope) --out=shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            run-errors-${{ matrix.shard }}.json
            killed-${{ matrix.shard }}.json
            cost-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: stryker-baseline-${{ matrix.shard }}
          path: stryker-baseline.json
          retention-days: 30
      - name: Every in-scope mutant tested
        run: |
          n="$(python3 -c 'import json; c = json.load(open("counts.json")); print(c.get("Untested", 0) + c.get("Ignored", 0))')"
          [ "$n" = 0 ] || { echo "::error::$n mutant(s) left untested by the time budget"; exit 1; }

  # Files whose Windows-only branches (OperatingSystem.IsWindows(): the protected-DACL private files of OwnerOnly.cs, CreateHardLinkW / the process
  # table / no directory fsync in DurableState.cs, the missing directory fsync of FileMeshWitnessStore.cs) no Linux runner executes: they are
  # mutated ON WINDOWS too, with only the tests that reach them as the oracle. The merge counts a Linux survivor of these files only when it also
  # survived here (mutation-merge.mjs: a winshard-<n>.json report names its files in `scope`); these shards are not part of SHARDS.
  winshard:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    name: windows shard ${{ matrix.n }} (${{ matrix.files }})
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # DurableState.cs (about 1700 mutants, each run against the durable-state scenario replay: file I/O) whole did not finish in 2 h
        # (run 45843651201): it is cut in 16 parts as the plan cuts spans (File.cs#i/n@j/m at member declarations), each part mutating its
        # lines with everything else fenced, sized from a static count at about 150 mutants a part; Load() (lines 682..802, about 250-350)
        # is one member and cannot be cut. The merge checks that a file's Windows parts partition its lines (a missing part fails it).
        # Load() is now cut into its checks (ParseRec / CheckRec / ApplyRec / CheckTail) and the lock loop into its steps: 23 parts of
        # at most ~55 code lines each (Recover, 5/12@1/2, is one member of ~70).
        include:
          - { n: 1, files: 'AtlasPca/OwnerOnly.cs', filter: 'FullyQualifiedName~OwnerOnlyTests' }
          - { n: 2, files: 'AtlasPca/DurableState.cs#1/12', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 4, files: 'AtlasPca/DurableState.cs#2/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 5, files: 'AtlasPca/DurableState.cs#2/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 6, files: 'AtlasPca/DurableState.cs#3/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 7, files: 'AtlasPca/DurableState.cs#3/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 8, files: 'AtlasPca/DurableState.cs#4/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 9, files: 'AtlasPca/DurableState.cs#4/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 10, files: 'AtlasPca/DurableState.cs#5/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 11, files: 'AtlasPca/DurableState.cs#5/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 12, files: 'AtlasPca/DurableState.cs#6/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 13, files: 'AtlasPca/DurableState.cs#6/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 14, files: 'AtlasPca/DurableState.cs#7/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 15, files: 'AtlasPca/DurableState.cs#7/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 16, files: 'AtlasPca/DurableState.cs#8/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 17, files: 'AtlasPca/DurableState.cs#8/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 18, files: 'AtlasPca/DurableState.cs#9/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 19, files: 'AtlasPca/DurableState.cs#9/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 20, files: 'AtlasPca/DurableState.cs#10/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 21, files: 'AtlasPca/DurableState.cs#10/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 22, files: 'AtlasPca/DurableState.cs#11/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 23, files: 'AtlasPca/DurableState.cs#11/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 24, files: 'AtlasPca/DurableState.cs#12/12@1/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 25, files: 'AtlasPca/DurableState.cs#12/12@2/2', filter: 'FullyQualifiedName~DurableStateTests|FullyQualifiedName~DsNativeTests|FullyQualifiedName~KvStateStoreDurableBudgetTests|FullyQualifiedName~OwnerOnlyTests' }
          - { n: 3, files: 'AtlasPca/Ext/FileMeshWitnessStore.cs', filter: 'FullyQualifiedName~FileMeshWitnessStoreTests|FullyQualifiedName~OwnerOnlyTests' }
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Flagship tooling + source layout
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - name: RSA DPoP oracle corpus (generated, never committed)
        run: .github/scripts/dpop-rsa-corpus.sh "$MONO/sdks/dotnet-pca/AtlasPca.Corpus.Tests/test-data/ref-dpop-rsa.json.gz"
      - name: Secret-key oracle corpora (generated, never committed)
        run: .github/scripts/gen-secret-corpus.sh "$MONO/sdks/dotnet-pca/AtlasPca.Corpus.Tests/test-data" oprf:oprf core-frost-java:core-frost-java attest-eat:attest-eat frost-dkg:frost-dkg
      - name: Mutate (the tests that reach the file only)
        working-directory: ${{ env.MONO }}/sdks/dotnet-pca/AtlasPca.Corpus.Tests
        env:
          FILES: ${{ matrix.files }}
          FILTER: ${{ matrix.filter }}
          PCA_RUNERR_LOG: ${{ runner.temp }}/runerr-stryker.log
        run: |
          set -o pipefail
          dotnet tool install -g dotnet-stryker --version 4.14.2
          SDK8="$(dotnet --list-sdks | awk '/^8\./ { v = $1 } END { print v }')"
          [ -n "$SDK8" ] || { echo "::error::no .NET 8 SDK"; exit 1; }
          (cd .. && dotnet new globaljson --sdk-version "$SDK8" --roll-forward disable --force >/dev/null)
          # a mutant run needs a green baseline: the filtered oracle must pass on the unmutated source
          dotnet test -c Release --filter "$FILTER" > "$RUNNER_TEMP/baseline.log" 2>&1 || { tail -40 "$RUNNER_TEMP/baseline.log"; echo "::error::the Windows oracle ($FILTER) fails on the unmutated source"; exit 1; }
          grep -aE "Passed!|Failed!|Total tests|Duration" "$RUNNER_TEMP/baseline.log" | tail -3 || true  # the oracle's own time: the floor of every mutant's run
          [ ! -s "$PCA_RUNERR_LOG" ] || { cat "$PCA_RUNERR_LOG"; echo "::error::the unmutated source hits OutOfMemoryException"; exit 1; }
          # the core shards' settings, but only the corpus project as oracle and only the tests that reach the file
          python - <<'PY'
          import json, os
          s = open("AtlasPca.Corpus.Tests.csproj").read()
          cap = '<ItemGroup><RuntimeHostConfigurationOption Include="System.GC.HeapHardLimit" Value="3221225472" /></ItemGroup>'
          assert "</Project>" in s
          open("AtlasPca.Corpus.Tests.csproj", "w").write(s.replace("</Project>", cap + "\n</Project>"))
          c = json.load(open("stryker-config.json"))
          c["stryker-config"].update({"test-projects": ["AtlasPca.Corpus.Tests.csproj"], "test-case-filter": os.environ["FILTER"]})
          json.dump(c, open("stryker-config.json", "w"))
          PY
          # the shard's file whole (scope + glob) and every other file of the project fenced, as the Linux shards: Stryker compiles
          # the mutants of every file whatever --mutate says, and one unrollbackable mutant elsewhere aborted the shard
          python "$GITHUB_WORKSPACE/.github/scripts/stryker-spans.py" 0 "$SHARDS" ../AtlasPca --scope "$RUNNER_TEMP/scope.json" --only "${FILES#AtlasPca/}" > "$RUNNER_TEMP/globs.txt"
          FILE="${FILES%%#*}"  # a part (File.cs#i/n[@j/m]) mutates only its lines: the rest of the file is fenced like every other file
          [ "$(cat "$RUNNER_TEMP/globs.txt")" = "**/$FILE" ] || { cat "$RUNNER_TEMP/globs.txt"; echo "::error::expected the one glob **/$FILE"; exit 1; }
          touch "$RUNNER_TEMP/stryker-ran"
          # Stryker's console only reaches the log at the end: a heartbeat every 5 min (from its trace log: one "Test run for <mutants> is
          # success|failed" line per test session) shows how far it got and whether it stalled
          ( while sleep 300; do L="$(ls -t StrykerOutput/*/logs/*.txt 2>/dev/null | head -1 || true)"; [ -n "$L" ] || { echo "progress $(( ($(date +%s) - JOB_START) / 60 )) min: no trace log yet"; continue; }
              echo "progress $(( ($(date +%s) - JOB_START) / 60 )) min: $(grep -aoE '[0-9]+ +total mutants will be tested' "$L" | tail -1 | grep -oE '^[0-9]+' || echo '?') to test, $(grep -ac 'Test run for ' "$L") test runs done ($(grep -ac 'Test run for .* is failed' "$L") failing); last: $(tail -1 "$L" | cut -c1-160)"; done ) & HB=$!
          trap 'kill $HB 2>/dev/null || true' EXIT
          dotnet stryker --config-file stryker-config.json --log-to-file --concurrency 4 --mutate "**/$FILE" 2>&1 | grep -vE '^\s*$' | tee "$RUNNER_TEMP/stryker.out" | tail -30 || { grep -aE "unidentified mutation|error CS|CS[0-9]{4}" "$RUNNER_TEMP/stryker.out" | cut -c1-400 | head -80 || true; echo "compile diagnostics from the trace log:"; echo "compile attempts: $(find . -path "*StrykerOutput*" -name "*.txt" -exec grep -ahc "Trying compilation" {} + 2>/dev/null | awk '{ s += $1 } END { print s + 0 }')"; find . -path "*StrykerOutput*" -name "*.txt" -exec grep -ahE "error CS[0-9]{4}|CS[0-9]{4}[:,]|SourceFile\(|RollBacking|General compilation error|unidentified mutation|Safe Mode|Unable to extract|Found mutant" {} + 2>/dev/null | sed -E "s/^[^[]*\[[A-Z]{3}\] //" | sort | uniq -c | sort -rn | cut -c1-400 | head -80 || true; exit 1; }
      - name: Report (+ every in-scope CompileError tested alone)
        env:
          FILTER: ${{ matrix.filter }}
        run: |
          S="$GITHUB_WORKSPACE/.github/scripts"; D="$MONO/sdks/dotnet-pca"
          REP="$(ls -d "$D"/AtlasPca.Corpus.Tests/StrykerOutput/*/reports/mutation-report.json | tail -1)"
          python "$S/stryker-report.py" collect --scope "$RUNNER_TEMP/scope.json" --all "$RUNNER_TEMP/all.json" --retest "$RUNNER_TEMP/retest.json" \
            --runerr-log "$RUNNER_TEMP/runerr-stryker.log" --report "$REP"
          # the isolated builds need the unfenced sources (the fenced copy has the directive lines)
          cp -R "$GITHUB_WORKSPACE"/AtlasPca/. "$D/AtlasPca/"
          if [ "$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/retest.json")" -gt 0 ]; then
            python "$S/stryker-isolate.py" --src "$D" --mutants "$RUNNER_TEMP/retest.json" --out "$RUNNER_TEMP/isolated.json" \
              --tests AtlasPca.Corpus.Tests --dirs AtlasPca,AtlasPca.AspNetCore.Tests --filter "$FILTER" \
              --jobs 4 --stop-on-fail --deadline $((JOB_START + 100 * 60)) > "$RUNNER_TEMP/isolate.log" 2>&1 || { tail -80 "$RUNNER_TEMP/isolate.log"; echo "::error::stryker-isolate.py failed"; exit 1; }
            tail -30 "$RUNNER_TEMP/isolate.log"
          fi
          python "$S/stryker-report.py" finish --all "$RUNNER_TEMP/all.json" --isolated "$RUNNER_TEMP/isolated.json" \
            --sources "$GITHUB_WORKSPACE" --scope "$RUNNER_TEMP/scope.json" --counts counts.json \
            --survivors survivors.json --baseline stryker-baseline.json --runerrors run-errors-win-${{ matrix.n }}.json \
            --ledger "$MONO/sdks/dotnet-pca/mutation-run-errors.json" --killed killed-win-${{ matrix.n }}.json
          node .github/scripts/mutation-shard-report.mjs --crate="$CRATE" --shard=${{ matrix.n }} --of="$SHARDS" --tool=stryker-net \
            --counts=counts.json --survivors=survivors.json $(grep -qx '{}' counts.json && echo --empty=no-mutant-in-scope) --scope="$(python -c 'import json, sys; print(",".join(f"{k}#{a}-{b}" for k, (a, b) in json.load(open(sys.argv[1])).items()))' "$RUNNER_TEMP/scope.json")" --out=winshard-${{ matrix.n }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: winshard-${{ matrix.n }}
          path: winshard-${{ matrix.n }}.json
      # the run-error gate (merge job) lists the Linux shards only: a Windows run error would have no ledger entry to prove it mutant-caused
      - name: No run errors, every mutant tested
        run: |
          n="$(python -c 'import json; c = json.load(open("counts.json")); print(c.get("Untested", 0) + c.get("Ignored", 0))')"
          [ "$n" = 0 ] || { echo "::error::$n mutant(s) left untested by the time budget"; exit 1; }
          e="$(python -c 'import json; print(len(json.load(open("run-errors-win-${{ matrix.n }}.json"))))')"
          [ "$e" = 0 ] || { cat run-errors-win-${{ matrix.n }}.json; echo "::error::$e Windows run error(s): not ledgered (the run-error gate lists the Linux shards)"; exit 1; }

  merge:
    needs: [reuse, shard, shard-b, shard-c, shard-d, module-shard, winshard]
    if: ${{ needs.reuse.outputs.skip != 'true' && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flagship checker + ledger
        run: .github/scripts/mutation-layout.sh "$CRATE"
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Merge shards and check the ledger
        run: >
          node .github/scripts/mutation-merge.mjs --crate="$CRATE" --shards="$SHARDS" --reports=reports
          --checker="$MONO/tools/pca-audit" --src="$GITHUB_WORKSPACE"
      # gate honesty: a RunError or Timeout mutant was "caught" by no assertion (test host crashed / aborted, every failing test hit
      # OutOfMemoryException under the 3 GiB heap cap, or the run passed Stryker's limit: the baseline time plus 60 s,
      # additional-timeout in stryker-config.json). Each must be in sdks/dotnet-pca/mutation-run-errors.json with a
      # per-mutant reason that the mutant itself caused it (the unmutated suite passes under the same cap, checked in every
      # shard); an unlisted one, a missing shard list, or a stale entry fails.
      - name: Run errors are each proven mutant-caused
        if: ${{ !cancelled() }}
        run: |
          node .github/scripts/run-error-gate-check.mjs
          node .github/scripts/run-error-gate.mjs --reports=reports --ledger="$MONO/sdks/dotnet-pca/mutation-run-errors.json" --src="$MONO/sdks/dotnet-pca" --shards="$SHARDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survivors-merged
          path: reports/survivors-merged.json
          if-no-files-found: ignore

  reuse-record:
    name: reuse record
    needs: [reuse, natives, shard, shard-b, shard-c, shard-d, module-shard, winshard, merge]
    # only a run whose jobs all passed (skipped by their own conditions is fine), that was not partial and not itself a reuse, leaves a record
    if: ${{ !cancelled() && needs.reuse.outputs.skip != 'true' && needs.reuse.outputs.hash != '' && !(false) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: rec
        env:
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          HASH: ${{ needs.reuse.outputs.hash }}
        run: node .github/scripts/ci-reuse.mjs record --workflow=mutation --hash="$HASH" --out="$RUNNER_TEMP/reuse-record"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rec.outputs.artifact }}
          path: ${{ runner.temp }}/reuse-record/
          retention-days: 21
