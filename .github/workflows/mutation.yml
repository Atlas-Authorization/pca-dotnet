          set -o pipefail   # a failed Stryker run must fail the step (the grep|tail pipe below masked its exit status)
          # pinned. 4.8.1 (the version the ledger was built with) exhausts its 50 compile attempts on this project and aborts with
          # "Internal error due to compile error": its rollback of a CS0165 (use of unassigned local, raised at the USE of a pattern
          # variable, far from the mutant that hid its assignment) only peels the mutants around the use, one layer per attempt.
          # 4.14.2 finds the mutant that erased the assignment (rollback: CS0165/CS0177/CS0161) and adds an aggressive mode before the
          # last attempt; same mutators and report schema, still net8.0. The module shards below stay on 4.8.1 (they compile).
          # Its project analysis cannot parse the compiler command line of the newer SDKs preinstalled on the runner, so this copy
          # pins the .NET 8 SDK (global.json, CI copy only).
          # Stryker before 4.15 compiles with its own compiler's latest C# (14), not the project's (12 on net8.0): under C# 14 an array's
          # .Reverse() binds to the void Span overload and the unmutated source fails to compile, so stryker-config.json pins language-version CSharp12.
          dotnet tool install -g dotnet-stryker --version 4.14.2
          SDK8="$(dotnet --list-sdks | awk '/^8\./ { v = $1 } END { print v }')"
          [ -n "$SDK8" ] || { echo "::error::no .NET 8 SDK"; exit 1; }
          (cd .. && dotnet new globaljson --sdk-version "$SDK8" --roll-forward disable --force >/dev/null)
          dotnet --version
          # no separate unmutated run here: the report step's stryker-isolate.py always builds and runs both full test projects on the
          # unmutated source first (worker 0) and fails the shard if any test fails or hits OutOfMemoryException under the heap cap
          # a mutant that allocates without bound must die alone (a RunError, never a kill: see PCA_RUNERR_LOG), not exhaust
          # the runner: 3 GiB GC heap per test host, set in the test project's runtimeconfig (CI copy only). Not as a DOTNET_GCHeapHardLimit environment
          # variable: that also caps Stryker's in-process compilation, and every Pca.cs mutant then "caused compile errors".
          python3 - <<'PY'
          s = open("AtlasPca.Corpus.Tests.csproj").read()
          cap = '<ItemGroup><RuntimeHostConfigurationOption Include="System.GC.HeapHardLimit" Value="3221225472" /></ItemGroup>'
          assert "</Project>" in s
          open("AtlasPca.Corpus.Tests.csproj", "w").write(s.replace("</Project>", cap + "\n</Project>"))
          PY
          T=()
          [ -n "${STRYKER_BASELINE:-}" ] && T=(--baseline "$STRYKER_BASELINE" --carry "$RUNNER_TEMP/carried.json")
          python3 "$GITHUB_WORKSPACE/.github/scripts/stryker-spans.py" ${{ matrix.shard }} "$SHARDS" ../AtlasPca \
            --scope "$RUNNER_TEMP/scope.json" "${T[@]}" > "$RUNNER_TEMP/globs.txt"
          M=()
          while read -r g; do M+=(--mutate "$g"); done < "$RUNNER_TEMP/globs.txt"
          if [ "${#M[@]}" -eq 0 ]; then
            [ -n "${STRYKER_BASELINE:-}" ] || { echo "::error::no --mutate glob for this shard"; exit 1; }
            echo "targeted: no source line of this shard changed since the baseline, Stryker skipped"
            exit 0
          fi
          echo "mutate: ${M[*]}"
          if grep -q 'AtlasPca.AspNetCore/' "$RUNNER_TEMP/globs.txt"; then
            # the middleware project: Stryker runs from its test project, the same settings otherwise
            python3 -c 'import json; c = json.load(open("stryker-config.json")); c["stryker-config"].update({"project": "AtlasPca.AspNetCore.csproj", "test-projects": ["AtlasPca.AspNetCore.Tests.csproj"]}); json.dump(c, open("../AtlasPca.AspNetCore.Tests/stryker-config.json", "w"))'
